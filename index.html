<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brightpath — Plan smarter. Live brighter.</title>

  <style>
    :root {
      --green: #245541; --green-dark: #142b23; --green-soft: #e9f1eb;
      --text: #1e2924; --muted: #6b776f; --border: #e1e8e3;
      --bg: #f7f9f7; --danger: #b42318; --danger-bg: #fef3f2;
      --success: #1e6f3f; --success-bg: #ecf7ef; --radius: 14px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: var(--text); -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); min-width: 320px; line-height: 1.5; }
    body.modal-open { overflow: hidden; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    .hidden { display: none !important; }
    .container { width: min(1140px, 100% - 2.5rem); margin: 0 auto; }
    :focus-visible { outline: 3px solid rgba(36,85,65,.35); outline-offset: 2px; }

    /* ===== BUTTONS ===== */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 2.6rem; padding: .6rem 1.2rem; border-radius: 10px; font-size: .92rem; font-weight: 650; transition: transform .15s, background .15s, box-shadow .15s; }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:hover { background: #1c4534; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(36,85,65,.25); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-ghost { color: var(--text); }
    .btn-ghost:hover { background: var(--green-soft); }
    .btn-outline { border: 1.5px solid var(--border); background: #fff; color: var(--text); }
    .btn-outline:hover { border-color: var(--green); color: var(--green); }
    .btn-lg { min-height: 3.1rem; padding: .8rem 1.6rem; font-size: 1rem; }
    .btn-block { width: 100%; }
    .link-btn { color: var(--green); font-size: .85rem; font-weight: 650; }
    .link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }

    /* ===== NAVBAR ===== */
    .navbar { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.85); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
    .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 1rem; }
    .logo { display: inline-flex; align-items: center; gap: .6rem; font-weight: 750; font-size: 1.15rem; letter-spacing: -.03em; }
    .logo-mark { display: grid; place-items: center; width: 2.1rem; height: 2.1rem; border-radius: 10px; background: var(--green); color: #d7edcf; }
    .nav-links { display: flex; gap: 2rem; font-size: .92rem; color: var(--muted); font-weight: 550; }
    .nav-links a:hover { color: var(--green); }
    .user-chip { display: flex; align-items: center; gap: .6rem; font-size: .9rem; font-weight: 600; }
    .avatar { display: grid; place-items: center; width: 2.2rem; height: 2.2rem; border-radius: 50%; background: var(--green-soft); color: var(--green); font-weight: 750; }
    .menu-toggle { display: none; font-size: 1.5rem; padding: .3rem .5rem; }

    /* ===== HERO ===== */
    .hero { padding: 5rem 0 4.5rem; overflow: hidden; }
    .hero-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 3rem; align-items: center; }
    .badge { display: inline-flex; align-items: center; gap: .5rem; padding: .35rem .85rem; border-radius: 99px; background: var(--green-soft); color: var(--green); font-size: .8rem; font-weight: 650; margin-bottom: 1.4rem; }
    .badge-dot { width: .45rem; height: .45rem; border-radius: 50%; background: #3a9a63; }
    .hero h1 { font-size: clamp(2.5rem, 5.5vw, 4.3rem); line-height: 1.05; letter-spacing: -.055em; font-weight: 700; margin-bottom: 1.3rem; }
    .hero h1 span { color: var(--green); }
    .hero-text { font-size: 1.12rem; color: var(--muted); max-width: 32rem; margin-bottom: 2rem; }
    .hero-cta { display: flex; flex-wrap: wrap; gap: .8rem; }
    .hero-note { margin-top: 1.4rem; font-size: .85rem; color: var(--muted); }
    .hero-visual { position: relative; padding: 1.6rem; border-radius: 22px; background: linear-gradient(145deg, var(--green-dark), #2b5e47); color: #fff; box-shadow: 0 30px 60px rgba(20,43,35,.25); }

    /* Welcome Card */
    .welcome-card { background: #fff; border: 1px solid var(--border); border-radius: 22px; padding: 2.5rem; max-width: 42rem; box-shadow: 0 10px 30px rgba(20,43,35,.06); }
    .welcome-card h1 { font-size: clamp(2rem, 4.5vw, 3rem); margin-bottom: .8rem; }
    .welcome-email { color: var(--green); font-weight: 650; word-break: break-all; }

    /* ===== SECTIONS ===== */
    .section { padding: 4.5rem 0; }
    .section-white { background: #fff; border-block: 1px solid var(--border); }
    .section-head { text-align: center; max-width: 36rem; margin: 0 auto 3rem; }
    .eyebrow { font-size: .75rem; font-weight: 750; letter-spacing: .15em; color: var(--green); margin-bottom: .6rem; }
    .section-head h2 { font-size: clamp(1.8rem, 3.5vw, 2.5rem); letter-spacing: -.045em; line-height: 1.15; }
    .section-head p { color: var(--muted); margin-top: .8rem; }
    .features, .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4rem; }
    .feature, .step { padding: 1.8rem; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg); transition: transform .2s, box-shadow .2s; }
    .feature-icon { display: grid; place-items: center; width: 3rem; height: 3rem; border-radius: 12px; background: var(--green-soft); font-size: 1.4rem; margin-bottom: 1.1rem; }
    .feature h3, .step h3 { font-size: 1.1rem; margin-bottom: .45rem; letter-spacing: -.02em; }
    .feature p, .step p { color: var(--muted); font-size: .94rem; }
    .cta-band { text-align: center; padding: 3.5rem 1.5rem; border-radius: 22px; background: linear-gradient(145deg, var(--green-dark), #2b5e47); color: #fff; }
    .cta-band h2 { font-size: clamp(1.7rem, 3.5vw, 2.4rem); margin-bottom: .7rem; }
    .cta-band .btn-primary { background: #fff; color: var(--green-dark); }
    .footer { padding: 2rem 0; border-top: 1px solid var(--border); background: #fff; font-size: .85rem; color: var(--muted); }
    .footer-inner { display: flex; justify-content: space-between; flex-wrap: wrap; }

    /* ===== MODAL ===== */
    .modal-overlay { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 1rem; background: rgba(15,30,24,.55); backdrop-filter: blur(4px); animation: fade .2s ease; }
    .modal { position: relative; width: min(100%, 420px); max-height: calc(100vh - 2rem); overflow-y: auto; padding: 2.2rem 2rem 2rem; border-radius: 20px; background: #fff; box-shadow: 0 30px 80px rgba(0,0,0,.25); animation: pop .25s ease; }
    @keyframes fade { from { opacity: 0; } } @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } }
    .modal-close { position: absolute; top: 1rem; right: 1rem; width: 2.2rem; height: 2.2rem; border-radius: 50%; font-size: 1.3rem; color: var(--muted); }
    .modal-close:hover { background: var(--bg); color: var(--text); }
    .modal-head { margin-bottom: 1.4rem; text-align: center; }
    .modal-head h2 { font-size: 1.7rem; letter-spacing: -.045em; line-height: 1.2; }
    .modal-head p { color: var(--muted); font-size: .92rem; margin-top: .35rem; }

    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: .25rem; padding: .3rem; border-radius: 12px; background: var(--bg); border: 1px solid var(--border); margin-bottom: 1.2rem; }
    .tab { min-height: 2.5rem; border-radius: 9px; color: var(--muted); font-size: .9rem; font-weight: 600; }
    .tab.active { background: #fff; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.08); }

    .msg { padding: .75rem .9rem; border-radius: 10px; font-size: .86rem; margin-bottom: 1rem; }
    .msg.error { color: var(--danger); background: var(--danger-bg); border: 1px solid #fecdca; }
    .msg.success { color: var(--success); background: var(--success-bg); border: 1px solid #c3e6cb; }

    /* Forms */
    .form { display: grid; gap: 1rem; }
    .field { display: grid; gap: .4rem; }
    .field label { font-size: .84rem; font-weight: 600; color: #35423a; }
    .field-row { display: flex; justify-content: space-between; align-items: center; }
    .field input { width: 100%; min-height: 2.9rem; padding: .7rem .9rem; border: 1px solid var(--border); border-radius: 10px; font-size: .92rem; transition: border-color .15s, box-shadow .15s; }
    .field input:focus { outline: none; border-color: #5b8b6d; box-shadow: 0 0 0 3px rgba(67,123,84,.12); }
    .pass-wrap { position: relative; }
    .pass-wrap input { padding-right: 4rem !important; }
    .pass-toggle { position: absolute; right: .7rem; top: 50%; transform: translateY(-50%); font-size: .78rem; font-weight: 650; color: #5b7664; padding: .25rem; }
    .check { display: flex; align-items: center; gap: .5rem; font-size: .85rem; color: var(--muted); cursor: pointer; }
    .check input { width: 1rem; height: 1rem; accent-color: var(--green); }

    /* ===== SOCIAL LOGINS ===== */
    .divider { display: flex; align-items: center; text-align: center; margin: 1.2rem 0; color: #a0aab2; font-size: .8rem; font-weight: 600; text-transform: uppercase; }
    .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid var(--border); }
    .divider::before { margin-right: 1rem; } .divider::after { margin-left: 1rem; }
    .social-logins { display: flex; gap: .8rem; justify-content: center; }
    .social-btn { flex: 1; display: grid; place-items: center; height: 3.2rem; border: 1px solid var(--border); border-radius: 10px; background: #fff; transition: background .15s, border-color .15s; }
    .social-btn:hover { background: var(--bg); border-color: #cbd5e1; }
    .social-btn img { width: 1.4rem; height: 1.4rem; }

    /* Verify & Spinner */
    .verify { text-align: center; }
    .verify-icon { font-size: 3rem; margin-bottom: .4rem; }
    .verify-email { color: var(--green); font-weight: 650; margin: .3rem 0 1rem; }
    .spinner { width: 1.1rem; height: 1.1rem; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Mobile */
    @media (max-width: 720px) {
      .menu-toggle { display: block; }
      .nav-links { display: none; position: absolute; top: 68px; left: 0; right: 0; flex-direction: column; gap: 0; background: #fff; border-bottom: 1px solid var(--border); }
      .nav-links.open { display: flex; }
      .nav-links a { padding: 1rem 1.25rem; border-top: 1px solid var(--border); }
      .user-name-text, #nav-login { display: none; }
      .hero-grid, .features, .steps { grid-template-columns: 1fr; }
      .modal { padding: 2rem 1.3rem 1.5rem; }
    }
  </style>
</head>

<body>
  <!-- ================= NAVBAR ================= -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="#top" class="logo"><span class="logo-mark">✦</span> brightpath</a>
      <nav class="nav-links" id="nav-links">
        <a href="#features">Features</a> <a href="#how">How it works</a>
      </nav>
      <div class="nav-actions">
        <div id="guest-actions">
          <button class="btn btn-ghost" id="nav-login">Log in</button>
          <button class="btn btn-primary" id="nav-signup">Sign up</button>
        </div>
        <div class="user-chip hidden" id="user-actions">
          <span class="avatar" id="nav-avatar">U</span>
          <span class="user-name-text" id="nav-name">User</span>
          <button class="btn btn-outline" id="nav-logout">Log out</button>
        </div>
        <button class="menu-toggle" id="menu-toggle">☰</button>
      </div>
    </div>
  </header>

  <main id="top">
    <!-- ================= HERO (GUEST) ================= -->
    <section class="hero" id="hero-guest">
      <div class="container hero-grid">
        <div>
          <span class="badge"><span class="badge-dot"></span> Free forever</span>
          <h1>Plan smarter.<br><span>Live brighter.</span></h1>
          <p class="hero-text">Organise your day and track your goals in one calm space.</p>
          <div class="hero-cta">
            <button class="btn btn-primary btn-lg" data-open="signup">Get started free</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= HERO (LOGGED IN) ================= -->
    <section class="hero hidden" id="hero-user">
      <div class="container">
        <div class="welcome-card">
          <span class="badge"><span class="badge-dot"></span> Logged In</span>
          <h1 id="welcome-title">Welcome back! 🎉</h1>
          <p class="hero-text">Signed in as <span class="welcome-email" id="welcome-email"></span></p>
          <button class="btn btn-outline" id="hero-logout">Log out</button>
        </div>
      </div>
    </section>
  </main>

  <!-- ================= AUTH MODAL ================= -->
  <div class="modal-overlay hidden" id="auth-modal">
    <div class="modal">
      <button class="modal-close" id="modal-close">×</button>

      <div class="modal-head">
        <h2 id="m-title">Welcome</h2>
        <p id="m-desc">Log in with Email</p>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab active" id="tab-login" type="button">Log in</button>
        <button class="tab" id="tab-signup" type="button">Sign up</button>
      </div>

      <p class="msg hidden" id="msg"></p>

      <!-- LOGIN FORM -->
      <form class="form" id="login-form" autocomplete="off">
        <div class="field">
          <label for="login-email">Email ID</label>
          <input id="login-email" type="email" placeholder="thisisemail@mail.com" autocomplete="off" required>
        </div>
        <div class="field">
          <div class="field-row">
            <label for="login-pass">Password</label>
            <button class="link-btn" type="button" id="forgot-link">Forgot password?</button>
          </div>
          <div class="pass-wrap">
            <input id="login-pass" type="password" placeholder="••••••••••••" autocomplete="new-password" required>
            <button class="pass-toggle" type="button" data-target="login-pass">Show</button>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="remember-me" checked> Remember me</label>
        <button class="btn btn-primary btn-lg btn-block" type="submit" id="login-btn">LOGIN</button>

        <div class="divider">OR</div>
        <div class="social-logins">
          <button type="button" class="social-btn" data-provider="google"><img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"></button>
          <button type="button" class="social-btn" data-provider="facebook"><img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook"></button>
          <button type="button" class="social-btn" data-provider="github"><img src="https://www.svgrepo.com/show/475654/github-color.svg" alt="GitHub"></button>
        </div>
        <p style="text-align: center; font-size: .85rem; margin-top: .5rem;">Don't have an account? <span class="link-btn" style="cursor:pointer;" onclick="document.getElementById('tab-signup').click()">Register Now</span></p>
      </form>

      <!-- SIGNUP FORM -->
      <form class="form hidden" id="signup-form" autocomplete="off">
        <div class="field">
          <label for="signup-name">Full name</label>
          <input id="signup-name" type="text" placeholder="Your name" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="signup-email">Email address</label>
          <input id="signup-email" type="email" placeholder="you@example.com" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="signup-pass">Password</label>
          <div class="pass-wrap">
            <input id="signup-pass" type="password" placeholder="••••••••••••" autocomplete="new-password" required>
            <button class="pass-toggle" type="button" data-target="signup-pass">Show</button>
          </div>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit" id="signup-btn">REGISTER NOW</button>

        <div class="divider">OR</div>
        <div class="social-logins">
          <button type="button" class="social-btn" data-provider="google"><img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"></button>
          <button type="button" class="social-btn" data-provider="facebook"><img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook"></button>
          <button type="button" class="social-btn" data-provider="github"><img src="https://www.svgrepo.com/show/475654/github-color.svg" alt="GitHub"></button>
        </div>
      </form>

      <!-- FORGOT FORM -->
      <form class="form hidden" id="forgot-form">
        <div class="field">
          <label for="forgot-email">Email address</label>
          <input id="forgot-email" type="email" placeholder="you@example.com" required>
        </div>
        <button class="btn btn-primary btn-lg btn-block" type="submit" id="forgot-btn">Send reset link</button>
        <button class="link-btn" type="button" id="forgot-back">← Back to log in</button>
      </form>

      <!-- VERIFY EMAIL -->
      <div class="verify hidden" id="verify-box">
        <div class="verify-icon">📧</div>
        <p>Verification link sent to</p>
        <p class="verify-email" id="verify-email"></p>
        <button class="btn btn-primary btn-lg btn-block" type="button" id="verified-btn" style="margin-bottom:1rem;">I've verified my email</button>
        <button class="link-btn" type="button" id="verify-back">← Back to log in</button>
      </div>
    </div>
  </div>

  <!-- FIREBASE SCRIPTS -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    // ╔══════════════════════════════════════════════╗
    // ║   ⚠️  APNA FIREBASE CONFIG YAHAN PASTE KARO   ║
    // ╚══════════════════════════════════════════════╝
    const firebaseConfig = {
     apiKey: "AIzaSyDPB9iPQNK3KCdQwj4vxNStIBJKKQ_thdg",
  authDomain: "authentication-app-71836.firebaseapp.com",
  projectId: "authentication-app-71836",
  storageBucket: "authentication-app-71836.firebasestorage.app",
  messagingSenderId: "905980239712",
  appId: "1:905980239712:web:ff412a8ccaefe829e00805"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.useDeviceLanguage();

    const $ = id => document.getElementById(id);
    const modal = $("auth-modal"), msg = $("msg"), tabs = $("tabs");
    const loginForm = $("login-form"), signupForm = $("signup-form");
    const forgotForm = $("forgot-form"), verifyBox = $("verify-box");

    function showMsg(text, type = "error") { msg.textContent = text; msg.className = "msg " + type; }
    function hideMsg() { msg.className = "msg hidden"; msg.textContent = ""; }

    function friendlyError(code) {
      const map = {
        "auth/email-already-in-use": "This email is already registered.",
        "auth/invalid-email": "Please enter a valid email.",
        "auth/user-not-found": "No account found with this email.",
        "auth/wrong-password": "Incorrect password.",
        "auth/invalid-credential": "Incorrect email or password.",
        "auth/account-exists-with-different-credential": "Email already used with a different login method (e.g. Google).",
        "auth/popup-closed-by-user": "Login popup was closed before completing."
      };
      return map[code] || "Something went wrong (" + code + ").";
    }

    function setLoading(btn, on) {
      if (on) { btn.dataset.html = btn.innerHTML; btn.innerHTML = '<span class="spinner"></span>'; btn.disabled = true; }
      else { btn.disabled = false; if (btn.dataset.html) btn.innerHTML = btn.dataset.html; }
    }

    function showScreen(name) {
      // FIX: Modal khulte hi purana data saaf kar do
      loginForm.reset();
      signupForm.reset();
      forgotForm.reset();

      [loginForm, signupForm, forgotForm, verifyBox].forEach(el => el.classList.add("hidden"));
      tabs.classList.toggle("hidden", name === "forgot" || name === "verify");
      $("tab-login").classList.toggle("active", name === "login");
      $("tab-signup").classList.toggle("active", name === "signup");
      hideMsg();

      if (name === "login")  { loginForm.classList.remove("hidden");  $("m-title").textContent = "Welcome"; $("m-desc").textContent = "Login with Email"; }
      if (name === "signup") { signupForm.classList.remove("hidden"); $("m-title").textContent = "Register"; $("m-desc").textContent = "Create an account"; }
      if (name === "forgot") { forgotForm.classList.remove("hidden"); $("m-title").textContent = "Reset Password"; $("m-desc").textContent = "Enter your email"; }
      if (name === "verify") { verifyBox.classList.remove("hidden");  $("m-title").textContent = "Verify Email"; $("m-desc").textContent = "Check your inbox"; }
    }

    function openModal(screen = "login") {
      showScreen(screen);
      modal.classList.remove("hidden");
      document.body.classList.add("modal-open");
      $("nav-links").classList.remove("open");
    }

    async function closeModal() {
      modal.classList.add("hidden");
      document.body.classList.remove("modal-open");
      // FIX: Modal band hone par bhi clear kar do
      loginForm.reset();
      signupForm.reset();
      const u = auth.currentUser;
      if (u && !u.emailVerified && u.providerData[0].providerId === 'password') await auth.signOut();
    }

    function updateUI(user) {
      // Social logins (Google/Facebook/GitHub) mostly bypass email verification rule
      const isEmailPass = user && user.providerData.some(p => p.providerId === 'password');
      const loggedIn = !!(user && (user.emailVerified || !isEmailPass));

      $("guest-actions").classList.toggle("hidden", loggedIn);
      $("user-actions").classList.toggle("hidden", !loggedIn);
      $("hero-guest").classList.toggle("hidden", loggedIn);
      $("hero-user").classList.toggle("hidden", !loggedIn);

      if (loggedIn) {
        const name = user.displayName || user.email.split("@")[0];
        $("nav-name").textContent = name;
        $("nav-avatar").textContent = name.charAt(0).toUpperCase();
        $("welcome-email").textContent = user.email;
      }
    }

    document.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openModal(b.dataset.open)));
    $("nav-login").addEventListener("click", () => openModal("login"));
    $("nav-signup").addEventListener("click", () => openModal("signup"));
    $("tab-login").addEventListener("click", () => showScreen("login"));
    $("tab-signup").addEventListener("click", () => showScreen("signup"));
    $("forgot-link").addEventListener("click", () => showScreen("forgot"));
    $("forgot-back").addEventListener("click", () => showScreen("login"));
    $("modal-close").addEventListener("click", closeModal);
    $("menu-toggle").addEventListener("click", () => $("nav-links").classList.toggle("open"));

    document.querySelectorAll(".pass-toggle").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = $(btn.dataset.target);
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.textContent = show ? "Hide" : "Show";
      });
    });

    // ---------- SOCIAL LOGINS (Google, Facebook, GitHub) ----------
    document.querySelectorAll(".social-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const providerName = btn.dataset.provider;
        let provider;

        if (providerName === 'google') provider = new firebase.auth.GoogleAuthProvider();
        if (providerName === 'facebook') provider = new firebase.auth.FacebookAuthProvider();
        if (providerName === 'github') provider = new firebase.auth.GithubAuthProvider();

        try {
          // Popup open hoga social login ke liye
          const result = await auth.signInWithPopup(provider);
          updateUI(result.user);
          closeModal();
        } catch (err) {
          showMsg(friendlyError(err.code));
        }
      });
    });

    // ---------- EMAIL/PASSWORD SIGN UP ----------
    signupForm.addEventListener("submit", async e => {
      e.preventDefault();
      const email = $("signup-email").value.trim(), pass = $("signup-pass").value, btn = $("signup-btn");
      setLoading(btn, true);
      try {
        const { user } = await auth.createUserWithEmailAndPassword(email, pass);
        await user.updateProfile({ displayName: $("signup-name").value.trim() });
        await user.sendEmailVerification();
        showScreen("verify");
        $("verify-email").textContent = email;
      } catch (err) { showMsg(friendlyError(err.code)); }
      finally { setLoading(btn, false); }
    });

    // ---------- EMAIL/PASSWORD LOG IN ----------
    loginForm.addEventListener("submit", async e => {
      e.preventDefault();
      const email = $("login-email").value.trim(), pass = $("login-pass").value, btn = $("login-btn");
      setLoading(btn, true);
      try {
        await auth.setPersistence($("remember-me").checked ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
        const { user } = await auth.signInWithEmailAndPassword(email, pass);
        if (user.emailVerified) { updateUI(user); closeModal(); }
        else { showScreen("verify"); $("verify-email").textContent = user.email; }
      } catch (err) { showMsg(friendlyError(err.code)); }
      finally { setLoading(btn, false); }
    });

    // ---------- VERIFY ----------
    $("verified-btn").addEventListener("click", async () => {
      const btn = $("verified-btn"); setLoading(btn, true);
      try {
        await auth.currentUser.reload();
        if (auth.currentUser.emailVerified) { updateUI(auth.currentUser); closeModal(); }
        else showMsg("Not verified yet. Click the link in your email.");
      } catch (err) { showMsg(friendlyError(err.code)); }
      finally { setLoading(btn, false); }
    });
    $("verify-back").addEventListener("click", async () => { await auth.signOut(); showScreen("login"); });

    // ---------- FORGOT PASS ----------
    forgotForm.addEventListener("submit", async e => {
      e.preventDefault(); const btn = $("forgot-btn"); setLoading(btn, true);
      try { await auth.sendPasswordResetEmail($("forgot-email").value.trim()); showMsg("Reset link sent!", "success"); }
      catch (err) { showMsg(friendlyError(err.code)); } finally { setLoading(btn, false); }
    });

    // ---------- LOG OUT ----------
    async function logout() { await auth.signOut(); updateUI(null); }
    $("nav-logout").addEventListener("click", logout);
    $("hero-logout").addEventListener("click", logout);

    // Initial check
    auth.onAuthStateChanged(user => { if (modal.classList.contains("hidden")) updateUI(user); });
  </script>
</body>
</html>
